<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --surface:#FBFCFE; --surface-2:#F3F7FC;
    --border:#D7E0EC; --border-strong:#C2CEDE;
    --text:#16222E; --text-sub:#516275; --text-mute:#8593A4;
    --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#E8F0FE;
    --ok:#15803D;
    --warn:#B45309;
    --danger:#DC2626;
    --mono:"Cascadia Code","Cascadia Mono","SFMono-Regular",Menlo,"Consolas",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--sans)}

  /* 悬浮球：实心蓝 #2563EB，填满圆形窗体（不依赖 WebView2 透明，杜绝黑/洋红方块） */
  .orb{width:100%;height:100%;border-radius:50%;cursor:grab;position:relative;
    background:radial-gradient(circle at 36% 30%, #5b86f0, var(--blue) 64%);
    box-shadow:0 4px 16px rgba(37,99,235,.45);
    color:#fff;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
    transition:background .25s, box-shadow .25s;
    animation:breathe 2.8s ease-in-out infinite}
  .orb:active{cursor:grabbing}
  .orb svg{width:26px;height:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.22))}
  /* 告警态：实色危险红 */
  .orb.alert{background:radial-gradient(circle at 36% 30%, #f0796f, var(--danger) 64%);animation:alertpulse 1.1s ease-out infinite}
  /* 离线态：实色琥珀 */
  .orb.offline{background:radial-gradient(circle at 36% 30%, #e0b066, var(--warn) 64%);animation:none;box-shadow:0 4px 14px rgba(180,83,9,.4)}

  @keyframes breathe{0%,100%{box-shadow:0 4px 16px rgba(37,99,235,.4)}50%{box-shadow:0 6px 24px rgba(37,99,235,.7)}}
  @keyframes alertpulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.7)}70%{box-shadow:0 0 0 24px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
</style>
</head>
<body>
<div class="orb" id="orb" title="雷犀 · 监控状态">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
</div>

<script>
  const orb = document.getElementById('orb');

  // 状态切换（normal / alert / offline），由宿主 C# 下发
  window.chrome.webview.addEventListener('message', e => {
    const m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (m.type === 'state') {
      orb.classList.toggle('alert', m.state === 'alert');
      orb.classList.toggle('offline', m.state === 'offline');
    }
  });

  // 鼠标事件上报宿主（拖拽由 C# 用物理像素处理窗体移动，避免 DPI 缩放下错位）
  let dragging = false;
  orb.addEventListener('mousedown', e => { if (e.button === 0) { dragging = true; window.chrome.webview.postMessage({type:'dragStart'}); e.preventDefault(); } });
  document.addEventListener('mousemove', e => { if (dragging) window.chrome.webview.postMessage({type:'dragMove'}); });
  document.addEventListener('mouseup', e => { if (dragging) { dragging = false; window.chrome.webview.postMessage({type:'dragEnd'}); } });
  orb.addEventListener('dblclick', e => { if (e.button === 0) window.chrome.webview.postMessage({type:'doubleClick'}); });
  orb.addEventListener('contextmenu', e => { e.preventDefault(); window.chrome.webview.postMessage({type:'rightClick'}); });

  // 初始状态
  window.chrome.webview.postMessage({type:'ready'});
</script>
</body>
</html>
