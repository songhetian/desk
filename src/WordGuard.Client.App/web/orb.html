<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif}

  /* 悬浮球：完全对齐 prototype/index.html 的 .orb 样式 */
  .orb{width:58px;height:58px;border-radius:50%;cursor:grab;position:relative;
    background:radial-gradient(circle at 35% 30%,#8fb8ff,#2f6bff);
    box-shadow:0 6px 22px rgba(47,107,255,.55);
    animation:breathe 2.6s ease-in-out infinite;
    color:#fff;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
    transition:background .3s}
  .orb:active{cursor:grabbing}
  .orb svg{width:26px;height:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
  .orb.alert{background:radial-gradient(circle at 35% 30%,#ff9a9a,#ef4444);animation:alertpulse 1s ease-out infinite}
  .orb.offline{background:radial-gradient(circle at 35% 30%,#e9dc97,#b7a23f);animation:none;box-shadow:0 6px 18px rgba(150,140,70,.45)}

  @keyframes breathe{0%,100%{box-shadow:0 6px 22px rgba(47,107,255,.45)}50%{box-shadow:0 6px 34px rgba(47,107,255,.8)}}
  @keyframes alertpulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.75)}70%{box-shadow:0 0 0 26px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
</style>
</head>
<body>
<div class="orb" id="orb" title="监控状态 · 双击查看">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
</div>

<script>
  const orb = document.getElementById('orb');

  // 状态切换（normal / alert / offline），由宿主 C# 下发
  window.chrome.webview.addEventListener('message', e => {
    const m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (m.type === 'state') {
      orb.classList.toggle('alert', m.state === 'alert');
      orb.classList.toggle('offline', m.state === 'offline');
    }
  });

  // 鼠标事件上报宿主（拖拽由 C# 用物理像素处理窗体移动，避免 DPI 缩放下错位）
  let dragging = false;
  orb.addEventListener('mousedown', e => { if (e.button === 0) { dragging = true; window.chrome.webview.postMessage(JSON.stringify({type:'dragStart'})); e.preventDefault(); } });
  document.addEventListener('mousemove', e => { if (dragging) window.chrome.webview.postMessage(JSON.stringify({type:'dragMove'})); });
  document.addEventListener('mouseup', e => { if (dragging) { dragging = false; window.chrome.webview.postMessage(JSON.stringify({type:'dragEnd'})); } });
  orb.addEventListener('dblclick', e => { if (e.button === 0) window.chrome.webview.postMessage(JSON.stringify({type:'doubleClick'})); });
  orb.addEventListener('contextmenu', e => { e.preventDefault(); window.chrome.webview.postMessage(JSON.stringify({type:'rightClick'})); });

  // 初始状态
  window.chrome.webview.postMessage(JSON.stringify({type:'ready'}));
</script>
</body>
</html>
