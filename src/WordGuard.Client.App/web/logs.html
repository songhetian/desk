<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WordGuard · 监控日志</title>
<style>
  :root{
    --blue:#2563EB; --blue-d:#1E40AF; --blue-l:#EFF4FF;
    --ink:#0F172A; --sub:#475569; --mut:#94A3B8;
    --bg:#EEF2F7; --card:#FFFFFF; --line:#E2E8F0; --line-d:#CBD5E1;
    --hi:#DC2626; --hi-l:#FEF2F2; --mid:#D97706; --mid-l:#FFFBEB;
    --lo:#2563EB; --lo-l:#EFF4FF; --ok:#059669; --ok-l:#ECFDF5;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06);
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:13.5px;overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{height:100vh;display:flex;flex-direction:column;background:var(--bg)}

  .titlebar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;
    background:#fff;border-bottom:1px solid var(--line);flex:none}
  .titlebar .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .titlebar .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(160deg,var(--blue),var(--blue-d));
    display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.35)}
  .titlebar .brand small{font-weight:400;opacity:.75;font-size:11.5px;color:var(--sub)}
  .count{font-size:12px;background:var(--blue-l);color:var(--blue-d);padding:5px 12px;border-radius:20px;font-weight:600}

  .content{flex:1;padding:20px 24px;overflow:auto}
  h2{font-size:19px;margin:0 0 4px;font-weight:700}
  .sub{color:var(--sub);font-size:12.5px;margin:0 0 16px}

  .toolbar{display:flex;gap:9px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  .toolbar input[type=date],.toolbar input[type=text]{padding:8px 12px;border:1px solid var(--line-d);border-radius:8px;
    font-size:13px;background:#fff;color:var(--ink);font-family:inherit}
  .toolbar input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
  .toolbar .sep{color:var(--mut);font-size:12.5px}
  .btn{border:none;background:var(--blue);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--blue-d)}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;
    background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}
  th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
  th{background:#F8FAFC;font-weight:600;color:var(--sub);font-size:12px;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#F8FBFF}
  .tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:600}
  .tag.h{background:var(--hi-l);color:var(--hi)}
  .tag.m{background:var(--mid-l);color:var(--mid)}
  .tag.l{background:var(--lo-l);color:var(--lo)}
  .tag.w{background:var(--ok-l);color:var(--ok)}
  .content-cell{max-width:320px;white-space:pre-wrap;word-break:break-all}
  .time-cell{white-space:nowrap;font-family:var(--mono);font-size:11.5px;color:var(--sub)}
  .empty{color:var(--mut);text-align:center;padding:30px;background:var(--card);border:1px dashed var(--line-d);
    border-radius:13px;margin-top:14px;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="brand">
      <span class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <span>WordGuard <small>监控日志</small></span>
    </div>
    <span class="count" id="count">0 条</span>
  </div>

  <div class="content">
    <h2>审计日志</h2>
    <div class="sub">命中记录本地存储，仅本机可查</div>

    <div class="toolbar">
      <input type="date" id="fFrom"><span class="sep">至</span><input type="date" id="fTo">
      <input type="text" id="fFilter" placeholder="内容关键字（可选）">
      <button class="btn" onclick="query()">查询</button>
    </div>

    <table>
      <thead><tr><th>时间</th><th>目标</th><th>窗口</th><th>级别</th><th>触发内容</th><th>命中词</th><th>处理</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="emptyBox"></div>
  </div>
</div>

<script>
  window.chrome.webview.addEventListener('message', e => {
    const m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (m.type === 'init') { if (m.from) { document.getElementById('fFrom').value = m.from; document.getElementById('fTo').value = m.to; } query(); }
    else if (m.type === 'rows') render(m.rows || []);
  });
  function query() {
    window.chrome.webview.postMessage(JSON.stringify({type:'query', from: document.getElementById('fFrom').value, to: document.getElementById('fTo').value, filter: document.getElementById('fFilter').value}));
  }
  function render(rows) {
    document.getElementById('count').textContent = rows.length + ' 条';
    document.getElementById('emptyBox').innerHTML = '';
    document.getElementById('rows').innerHTML = rows.length ? rows.map(r => `
      <tr>
        <td class="time-cell">${esc(r.time)}</td>
        <td>${esc(r.target)}</td>
        <td>${esc(r.window)}</td>
        <td><span class="tag ${r.sev==='high'?'h':r.sev==='medium'?'m':'l'}">${sevName(r.sev)}</span></td>
        <td class="content-cell">${esc(r.content)}</td>
        <td>${(r.words||[]).map(w=>`<span class="tag h">${esc(w)}</span>`).join(' ')}</td>
        <td><span class="tag w">${esc(r.disp)}</span></td>
      </tr>`).join('') : '';
    if (!rows.length) document.getElementById('emptyBox').innerHTML = '<div class="empty">该时间范围内无命中记录</div>';
  }
  const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sevName = s => s === 'high' ? '高' : s === 'medium' ? '中' : '低';
  window.chrome.webview.postMessage(JSON.stringify({type:'ready'}));
</script>
</body>
</html>
