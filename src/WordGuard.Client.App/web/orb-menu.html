<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --surface:#FBFCFE; --surface-2:#F3F7FC;
    --border:#D7E0EC; --border-strong:#C2CEDE;
    --text:#16222E; --text-sub:#516275; --text-mute:#8593A4;
    --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#E8F0FE;
    --danger:#DC2626; --danger-l:#FCE8E8;
    --mono:"Cascadia Code","Cascadia Mono","SFMono-Regular",Menlo,"Consolas",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:var(--surface);overflow:hidden;font-family:var(--sans)}
  body{display:flex;align-items:flex-start;justify-content:flex-start;padding:4px;user-select:none;-webkit-user-select:none}

  .menu{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    box-shadow:0 8px 40px rgba(20,40,70,.22);overflow:hidden}

  .head{display:flex;align-items:center;gap:10px;padding:12px 13px;
    background:var(--blue);color:#fff}
  .head .logo{width:30px;height:30px;flex:0 0 auto;border-radius:6px;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center}
  .head .logo svg{width:17px;height:17px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .head .t{line-height:1.25}
  .head .t b{display:block;font-size:14px;font-weight:600;letter-spacing:.02em}
  .head .t span{display:block;font-size:10.5px;opacity:.85;letter-spacing:.04em}

  .item{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:3px 6px;font-size:13px;color:var(--text);
    cursor:default;transition:background .12s,color .12s;outline:none;border-radius:4px;font-family:var(--sans)}
  .item svg{width:16px;height:16px;flex:0 0 auto;color:var(--text-mute);transition:color .12s}
  .item:hover,.item:focus-visible{background:var(--blue-l);color:var(--blue-d)}
  .item:hover svg,.item:focus-visible svg{color:var(--blue-d)}
  .item:active{background:var(--blue-l)}
  .sep{height:1px;background:var(--border);margin:3px 12px}
  .item.danger{color:var(--danger)}
  .item.danger svg{color:var(--danger)}
  .item.danger:hover{background:var(--danger-l);color:var(--danger)}
  .item.danger:hover svg{color:var(--danger)}
</style>
</head>
<body>
<div class="menu" role="menu" aria-label="雷犀 悬浮球菜单">
  <div class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <div class="t"><b>雷犀</b><span>客服合规卫士 · 实时监控中</span></div>
  </div>

  <div class="item" role="menuitem" tabindex="0" data-action="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>状态面板</span>
  </div>
  <div class="item" role="menuitem" tabindex="0" data-action="log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    <span>监控日志</span>
  </div>
  <div class="item" role="menuitem" tabindex="0" data-action="simulate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span>模拟告警测试</span>
  </div>
  <div class="sep"></div>
  <div class="item danger" role="menuitem" tabindex="0" data-action="exit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    <span>退出雷犀</span>
  </div>
</div>

<script>
  const send = obj => window.chrome.webview.postMessage(obj);

  document.querySelectorAll('.item').forEach(el => {
    const fire = () => send({type:'menu', action: el.dataset.action});
    el.addEventListener('click', fire);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fire(); } });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') send({type:'close'}); });
  window.chrome.webview.postMessage({type:'menuReady'});
</script>
</body>
</html>
