<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷犀 · 词库管理端</title>
<style>
  :root{
    --bg:#EEF2F7; --bg-2:#E7EDF5;
    --surface:#FBFCFE; --surface-2:#F3F7FC; --surface-3:#EAF1FA;
    --border:#D7E0EC; --border-strong:#C2CEDE;
    --text:#16222E; --text-sub:#516275; --text-mute:#8593A4;
    --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#E8F0FE; --blue-ll:#F2F7FF;
    --ok:#15803D; --ok-l:#E6F4EA; --ok-b:#B7E0C2;
    --warn:#B45309; --warn-l:#FBEFE0; --warn-b:#F0D3A8;
    --danger:#DC2626; --danger-l:#FCE8E8; --danger-b:#F3B7B7;
    --shadow:0 1px 2px rgba(20,40,70,.06), 0 4px 16px rgba(20,40,70,.08);
    --shadow-lg:0 8px 40px rgba(20,40,70,.22);
    --mono:"Cascadia Code","Cascadia Mono","SFMono-Regular",Menlo,"Consolas",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
    --r:6px; --r-sm:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);
    font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;display:flex;flex-direction:column;overflow:hidden}

  .appbar{flex:none;display:flex;align-items:center;gap:12px;
    height:52px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:.01em}
  .shield{width:30px;height:30px;border-radius:7px;background:var(--blue);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 2px 6px rgba(37,99,235,.35)}
  .brand small{font-weight:500;color:var(--text-mute);font-size:11.5px;letter-spacing:.04em}
  .appbar .spacer{flex:1}
  .winctl{display:flex;gap:6px}
  .winctl i{width:12px;height:12px;border-radius:50%;background:var(--border-strong);display:block}

  .btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);
    color:var(--text);padding:8px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;
    cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:7px;min-height:36px}
  .btn:hover{background:var(--surface-2);border-color:#AEBECE}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .btn.primary{background:var(--blue);border-color:var(--blue-d);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.3)}
  .btn.primary:hover{background:var(--blue-d)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
  .btn.ghost:hover{background:var(--blue-l)}
  .btn.danger{color:var(--danger);border-color:var(--danger-b)}
  .btn.danger:hover{background:var(--danger-l)}
  .btn.danger-solid{background:#B91C1C;border-color:#991B1B;color:#fff}
  .btn.danger-solid:hover{background:#991B1B}
  .btn.sm{padding:5px 10px;font-size:12px;min-height:30px}
  .ico{width:15px;height:15px;flex:none}

  input,select,textarea{font-family:var(--sans);font-size:13px;color:var(--text);
    background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);
    padding:8px 11px;outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
  label.fld{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-sub);margin-bottom:6px}

  .badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
    font-weight:500;padding:2px 8px;border-radius:20px;border:1px solid transparent;letter-spacing:.01em}
  .badge.high{color:var(--danger);background:var(--danger-l);border-color:var(--danger-b)}
  .badge.medium{color:var(--warn);background:var(--warn-l);border-color:var(--warn-b)}
  .badge.low{color:var(--blue);background:var(--blue-l);border-color:#BFD2FB}
  .pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface-3);
    color:var(--text-sub);border:1px solid var(--border)}

  .studio-body{flex:1;display:grid;grid-template-columns:228px 1fr;min-height:0}
  .cat-rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .rail-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
  .rail-head .ttl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-sub)}
  .cat-list{flex:1;overflow:auto;padding:4px 8px 12px}
  .cat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--text-sub);font-size:13px;font-weight:500}
  .cat-item:hover{background:var(--surface-2)}
  .cat-item.on{background:var(--blue-l);color:var(--blue-d);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
  .cat-item .cnt{font-family:var(--mono);font-size:11px;color:var(--text-mute)}
  .cat-item.on .cnt{color:var(--blue)}

  .word-main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .toolbar{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--surface);
    border-bottom:1px solid var(--border)}
  .search{flex:1;max-width:340px;position:relative}
  .search input{padding-left:32px}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-mute)}
  .toolbar .spacer{flex:1}

  .tbl-wrap{flex:1;overflow:auto;padding:0 18px 18px;display:flex;flex-direction:column;min-height:220px}
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:14px;flex:1}
  tr.empty{height:100%}
  tr.empty td{padding:0;height:100%}
  .empty-cell{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-mute);font-size:13.5px;padding:28px;text-align:center}
  thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;
    font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-sub);
    padding:11px 14px;border-bottom:1px solid var(--border)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--bg-2);font-size:13px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.word{font-family:var(--mono);font-weight:600;color:var(--text)}
  td.op{white-space:nowrap;width:1%}
  td.op .btn{padding:4px 9px;min-height:28px}
  .toggle{width:38px;height:22px;border-radius:20px;background:var(--border-strong);position:relative;cursor:pointer;transition:.15s}
  .toggle.on{background:var(--ok)}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
  .toggle.on::after{left:18px}
  .tbl-foot{flex:none;padding:10px 18px;color:var(--text-mute);font-family:var(--mono);font-size:12px;background:var(--surface);border-top:1px solid var(--border)}

  .cbx{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border-strong);display:inline-grid;place-items:center;
    cursor:pointer;flex:none;color:#fff;font-size:12px;font-weight:700;line-height:1;background:var(--surface);transition:.12s}
  .cbx::after{content:"";display:none}
  .cbx.on::after{content:"✓";display:block}
  .cbx.mix{background:var(--surface);border-color:var(--blue-d)}
  .cbx.mix::after{content:"";display:block;width:9px;height:2px;background:var(--blue-d);border-radius:2px}
  .cbx:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .bulkbar{flex:none;display:none;align-items:center;gap:12px;padding:10px 18px;background:var(--blue-l);border-bottom:1px solid var(--border)}
  .bulkbar.on{display:flex}
  .bulkbar .selinfo{font-size:13px;font-weight:600;color:var(--blue-d)}
  .bulkbar .spacer{flex:1}

  .x{border:0;background:transparent;color:var(--text-mute);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px}
  .x:hover{background:var(--surface-2);color:var(--text)}

  .modal{position:fixed;inset:0;display:none;place-items:center;z-index:50;background:rgba(15,27,42,.32)}
  .modal.on{display:grid}
  .modal .box{width:min(460px,92vw);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);
    border:1px solid var(--border);display:flex;flex-direction:column;max-height:86vh}
  .modal .box header{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:600}
  .modal .body{padding:18px;display:flex;flex-direction:column;gap:16px}
  .modal .foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:#0F1B2A;color:#E7EEF6;padding:11px 18px;border-radius:var(--r);font-size:13px;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.2s;z-index:70;font-family:var(--sans);max-width:80vw}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .toast.err{background:#B91C1C}
  .hint{font-size:12px;color:var(--text-mute);margin-top:8px}
</style>
</head>
<body>

<section class="app" id="app">
  <div class="appbar">
    <div class="brand"><span class="shield">雷</span> 雷犀 <small>词库管理端</small></div>
    <div class="spacer"></div>
    <button class="btn primary" id="exportBtn">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      导出词库
    </button>
    <div class="winctl"><i></i><i></i><i></i></div>
  </div>

  <div class="studio-body">
    <!-- 分类栏 -->
    <aside class="cat-rail">
      <div class="rail-head"><span class="ttl">分类</span>
        <button class="btn sm ghost" id="addCatBtn">+ 新增</button></div>
      <div class="cat-list" id="catList"></div>
    </aside>

    <!-- 词表 -->
    <main class="word-main">
      <div class="toolbar">
        <div class="search">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" placeholder="搜索违禁词…">
        </div>
        <select id="sevFilter" style="width:140px">
          <option value="">全部级别</option>
          <option value="high">高</option><option value="medium">中</option><option value="low">低</option>
        </select>
        <div class="spacer"></div>
        <button class="btn primary" id="addWordBtn">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          新增违禁词
        </button>
      </div>

      <div class="bulkbar" id="bulkbar">
        <span class="selinfo" id="selCount">已选 0 项</span>
        <button class="btn sm" id="bulkEnable">启用选中</button>
        <button class="btn sm" id="bulkDisable">禁用选中</button>
        <button class="btn sm danger-solid" id="bulkDelete">删除选中</button>
        <div class="spacer"></div>
        <button class="btn sm ghost" id="bulkClear">取消选择</button>
      </div>

      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th style="width:40px"><span class="cbx" id="selAll" role="checkbox" aria-checked="false" tabindex="0" title="全选 / 取消全选"></span></th>
            <th style="width:31%">词语</th><th>分类</th><th>严重级别</th><th>状态</th><th style="text-align:right">操作</th>
          </tr></thead>
          <tbody id="wordBody"></tbody>
        </table>
      </div>
      <div class="tbl-foot" id="wordFoot">共 0 条</div>
    </main>
  </div>
</section>

<!-- 弹窗：新增/编辑违禁词（居中） -->
<div class="modal" id="wordModal">
  <div class="box">
    <header><span id="modalTitle">新增违禁词</span><button class="x" id="modalClose">×</button></header>
    <div class="body">
      <div><label class="fld">词语</label><input id="fWord" placeholder="如：示例违禁词"></div>
      <div><label class="fld">分类</label><select id="fCat"></select></div>
      <div><label class="fld">严重级别</label>
        <select id="fSev"><option value="high">高 · 必须拦截</option><option value="medium">中 · 重点提示</option><option value="low">低 · 记录</option></select>
      </div>
      <div style="display:flex;align-items:center;gap:10px"><label class="fld" style="margin:0">启用该词</label>
        <div class="toggle" id="fEnabled" role="checkbox" aria-checked="true" tabindex="0"></div></div>
    </div>
    <div class="foot"><button class="btn" id="modalCancel">取消</button><button class="btn primary" id="modalSave">保存</button></div>
  </div>
</div>

<!-- 删除确认弹窗（单选/批量共用） -->
<div class="modal" id="delModal">
  <div class="box" style="width:min(420px,92vw)">
    <header><span>确认删除</span><button class="x" id="delClose">×</button></header>
    <div class="body"><p id="delMsg" style="font-size:13.5px;color:var(--text-sub);line-height:1.7"></p></div>
    <div class="foot"><button class="btn" id="delCancel">取消</button><button class="btn danger-solid" id="delConfirm">删除</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const SEVTXT = { high:"高", medium:"中", low:"低" };

  let words = [];            // 来自后端 init/updated：[{id,text,category,severity,enabled}]
  let categories = [];       // [{name,count}]
  let curCat = "全部";
  let selWords = new Set();  // 选中的词条 id（GUID 字符串）
  let curIds = [];           // 当前筛选结果中的 id
  let editingId = null;      // 编辑中的词条 id；null=新增

  function post(type, payload){ window.chrome.webview.postMessage(Object.assign({type}, payload||{})); }
  function toast(t, err){ const e=$("#toast"); e.textContent=t; e.className="toast on"+(err?" err":""); clearTimeout(e._t); e._t=setTimeout(()=>e.className="toast",2600); }

  // ---------- 后端消息 ----------
  window.chrome.webview.addEventListener("message", e => {
    const m = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
    if (m.type === "init" || m.type === "updated") loadState(m);
    else if (m.type === "toast") toast(m.text, !m.ok);
  });

  function loadState(m){
    words = (m.words || []).map(w => ({ id:String(w.id), text:w.text, category:w.category, severity:w.severity, enabled:!!w.enabled }));
    categories = (m.categories || []).map(c => ({ name:c.name, count:c.count }));
    // 保持当前选中分类有效，否则回退“全部”
    if (curCat !== "全部" && !categories.some(c => c.name === curCat)) curCat = "全部";
    selWords.clear();
    renderCats(); renderWords();
  }

  // ---------- 分类 ----------
  function renderCats(){
    const el = $("#catList"); el.innerHTML = "";
    const all = [{ name:"全部", count: words.length }, ...categories];
    all.forEach(c => {
      const d = document.createElement("div");
      d.className = "cat-item" + (c.name === curCat ? " on" : "");
      d.innerHTML = `<span>${c.name}</span><span class="cnt">${c.count}</span>`;
      d.onclick = () => { curCat = c.name; $$(".cat-item").forEach(x=>x.classList.remove("on")); d.classList.add("on"); renderWords(); };
      el.appendChild(d);
    });
  }

  // ---------- 词表 ----------
  function renderWords(){
    const q = $("#searchInput").value.trim().toLowerCase();
    const sf = $("#sevFilter").value;
    const rows = words.filter(w =>
      (curCat === "全部" || w.category === curCat) &&
      (!sf || w.severity === sf) &&
      (!q || w.text.toLowerCase().includes(q)));
    curIds = rows.map(w => w.id);

    const tb = $("#wordBody"); tb.innerHTML = "";
    if (rows.length === 0){
      tb.innerHTML = `<tr class="empty"><td colspan="6"><div class="empty-cell">暂无违禁词，点击右上角“新增违禁词”</div></td></tr>`;
    }
    rows.forEach(w => {
      const sel = selWords.has(w.id);
      const tr = document.createElement("tr");
      if (sel) tr.style.background = "var(--blue-ll)";
      tr.innerHTML =
        `<td><span class="cbx ${sel?'on':''}" data-cb="${w.id}" role="checkbox" aria-checked="${sel}" tabindex="0"></span></td>
         <td class="word">${escapeHtml(w.text)}</td>
         <td>${escapeHtml(w.category || "未分类")}</td>
         <td><span class="badge ${w.severity}">${SEVTXT[w.severity]||w.severity}</span></td>
         <td><div class="toggle ${w.enabled?'on':''}" data-i="${w.id}"></div></td>
         <td class="op"><button class="btn sm" data-edit="${w.id}">编辑</button>
           <button class="btn sm danger" data-del="${w.id}">删除</button></td>`;
      tb.appendChild(tr);
    });
    $("#wordFoot").textContent = `共 ${rows.length} 条`;

    $$("#wordBody .toggle").forEach(t => t.onclick = () => {
      const id = t.dataset.i;
      const w = words.find(x => x.id === id); if (!w) return;
      w.enabled = !w.enabled; t.classList.toggle("on", w.enabled);
      post("toggleWord", { id, enabled: w.enabled });
    });
    $$("#wordBody [data-edit]").forEach(b => b.onclick = () => openModal(b.dataset.edit));
    $$("#wordBody [data-del]").forEach(b => b.onclick = () => openDelConfirm([b.dataset.del]));
    $$("#wordBody [data-cb]").forEach(c => {
      const tog = () => {
        const id = c.dataset.cb;
        if (selWords.has(id)) selWords.delete(id); else selWords.add(id);
        const on = selWords.has(id);
        c.classList.toggle("on", on); c.setAttribute("aria-checked", on);
        syncSelAll(); updateBulkbar();
      };
      c.onclick = tog;
      c.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); tog(); } };
    });
    syncSelAll(); updateBulkbar();
  }

  function syncSelAll(){
    const el = $("#selAll"); const total = curIds.length;
    const all = total > 0 && curIds.every(id => selWords.has(id));
    const some = curIds.some(id => selWords.has(id));
    el.classList.toggle("on", all);
    el.classList.toggle("mix", !all && some);
    el.setAttribute("aria-checked", all ? "true" : (some ? "mixed" : "false"));
  }
  function toggleSelAll(){
    const all = curIds.length > 0 && curIds.every(id => selWords.has(id));
    if (all) curIds.forEach(id => selWords.delete(id)); else curIds.forEach(id => selWords.add(id));
    $$("#wordBody [data-cb]").forEach(c => { const on = selWords.has(c.dataset.cb); c.classList.toggle("on", on); c.setAttribute("aria-checked", on); });
    syncSelAll(); updateBulkbar();
  }
  $("#selAll").onclick = toggleSelAll;
  $("#selAll").onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggleSelAll(); } };

  function updateBulkbar(){
    const b = $("#bulkbar");
    if (selWords.size === 0){ b.classList.remove("on"); return; }
    b.classList.add("on");
    $("#selCount").textContent = `已选 ${selWords.size} 项`;
  }

  $("#searchInput").oninput = renderWords;
  $("#sevFilter").onchange = renderWords;

  // ---------- 分类内联新增 ----------
  $("#addCatBtn").onclick = () => {
    if (document.getElementById("catInline")) return;
    const wrap = document.createElement("div");
    wrap.id = "catInline"; wrap.className = "cat-item";
    wrap.style.background = "var(--blue-ll)"; wrap.style.boxShadow = "inset 3px 0 0 var(--blue)";
    wrap.innerHTML = `<input id="catInput" placeholder="输入分类名，回车确认" style="border:0;background:transparent;padding:2px 0;font-size:13px;width:100%;outline:none;color:var(--text)">`;
    $("#catList").appendChild(wrap);
    const inp = wrap.querySelector("#catInput"); inp.focus();
    let cancelled = false;
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") inp.blur();
      else if (e.key === "Escape"){ cancelled = true; wrap.remove(); }
    });
    inp.addEventListener("blur", () => {
      if (cancelled) return;
      const v = inp.value.trim(); wrap.remove();
      if (v) post("addCategory", { name: v });
    });
  };

  // ---------- 新增/编辑弹窗 ----------
  function fillCatSelect(){
    const s = $("#fCat");
    const names = categories.map(c => c.name).filter(n => n && n !== "未分类");
    s.innerHTML = (names.length ? names : ["未分类"]).map(n => `<option>${n}</option>`).join("");
  }
  function openModal(id){
    editingId = id || null;
    $("#modalTitle").textContent = editingId ? "编辑违禁词" : "新增违禁词";
    const w = editingId ? words.find(x => x.id === editingId) : null;
    $("#fWord").value = w ? w.text : "";
    if (w) $("#fCat").value = w.category;
    $("#fSev").value = w ? w.severity : "medium";
    setToggle($("#fEnabled"), w ? w.enabled : true);
    fillCatSelect();
    if (w && $("#fCat").value !== w.category) { // 兜底：分类不在列表时补一项
      const o = document.createElement("option"); o.textContent = w.category; $("#fCat").appendChild(o); $("#fCat").value = w.category;
    }
    $("#wordModal").classList.add("on");
  }
  function closeModal(){ $("#wordModal").classList.remove("on"); editingId = null; }
  function setToggle(el, on){ el.classList.toggle("on", on); el.setAttribute("aria-checked", on); }
  $("#fEnabled").onclick = () => setToggle($("#fEnabled"), !$("#fEnabled").classList.contains("on"));
  $("#addWordBtn").onclick = () => openModal(null);
  $("#modalClose").onclick = closeModal; $("#modalCancel").onclick = closeModal;
  $("#wordModal").addEventListener("click", e => { if (e.target === $("#wordModal")) closeModal(); });
  $("#modalSave").onclick = () => {
    const text = $("#fWord").value.trim();
    if (!text){ toast("请填写词语", true); return; }
    post("saveWord", {
      text,
      category: $("#fCat").value,
      severity: $("#fSev").value,
      enabled: $("#fEnabled").classList.contains("on"),
      ...(editingId ? { id: editingId } : {})
    });
    closeModal();
  };

  // ---------- 批量操作 ----------
  $("#bulkEnable").onclick = () => { if (!selWords.size) return; post("bulkSetEnabled", { ids:[...selWords], enabled:true }); };
  $("#bulkDisable").onclick = () => { if (!selWords.size) return; post("bulkSetEnabled", { ids:[...selWords], enabled:false }); };
  $("#bulkDelete").onclick = () => { if (!selWords.size) return; openDelConfirm([...selWords]); };
  $("#bulkClear").onclick = () => { selWords.clear(); renderWords(); };

  // ---------- 删除确认（单选/批量共用） ----------
  let pendingDel = [];
  function openDelConfirm(ids){
    pendingDel = ids.slice();
    $("#delMsg").textContent = `确认删除选中的 ${pendingDel.length} 个违禁词？删除后不可恢复，客户端需重新导入词库才会同步。`;
    $("#delModal").classList.add("on");
  }
  function closeDel(){ $("#delModal").classList.remove("on"); pendingDel = []; }
  $("#delClose").onclick = closeDel; $("#delCancel").onclick = closeDel;
  $("#delModal").addEventListener("click", e => { if (e.target === $("#delModal")) closeDel(); });
  $("#delConfirm").onclick = () => { post("bulkDelete", { ids: pendingDel }); closeDel(); };

  // ---------- 导出 ----------
  $("#exportBtn").onclick = () => post("export");

  // ---------- 工具 ----------
  function escapeHtml(s){ return (s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

  // 启动：向后端请求初始数据
  post("init");
</script>
</body>
</html>
