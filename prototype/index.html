<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordGuard · 原型</title>
<style>
  :root{
    --accent:#2f6bff; --accent-2:#06b6d4; --accent-soft:#eaf1ff;
    --danger:#ef4444; --danger-soft:#fdeaea;
    --ok:#10b981; --ok-soft:#e7f6ef;
    --warn:#f59e0b; --warn-soft:#fef3e2;
    --text:#16203a; --muted:#6b7589; --faint:#9aa3b5;
    --bg:#eef2f9; --panel:#ffffff; --border:#e6eaf2;
    --shadow:0 1px 3px rgba(20,40,80,.06),0 10px 30px rgba(20,40,80,.07);
    --radius:14px;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(1100px 560px at 85% -12%,rgba(47,107,255,.10),transparent 60%),radial-gradient(800px 460px at 5% 115%,rgba(6,182,212,.10),transparent 60%),var(--bg);color:var(--text);font-size:13px;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(47,107,255,.05) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000,transparent 85%);mask-image:radial-gradient(ellipse at 50% 20%,#000,transparent 85%)}

  .app{width:1120px;max-width:calc(100% - 30px);margin:24px auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
  .app.studio{--accent:#7c3aed;--accent-2:#a855f7;--accent-soft:#f1e9ff}

  .titlebar{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
  .titlebar .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px}
  .titlebar .brand .logo{width:28px;height:28px;display:grid;place-items:center;background:rgba(255,255,255,.2);border-radius:9px;box-shadow:0 0 14px rgba(255,255,255,.25)}
  .titlebar .brand .logo svg{width:16px;height:16px}
  .titlebar .brand small{font-weight:500;opacity:.85;font-size:11.5px}
  .titlebar .btns{display:flex;gap:9px}
  .titlebar .btns span{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:9px;color:rgba(255,255,255,.7)}

  /* app switch */
  .appswitch{display:flex;gap:6px;padding:12px 18px;background:#f7f9fc;border-bottom:1px solid var(--border)}
  .appswitch button{border:1px solid var(--border);background:#fff;color:#5b657a;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px;transition:.15s}
  .appswitch button svg{width:16px;height:16px;opacity:.7}
  .appswitch button:hover{border-color:var(--accent);color:var(--accent)}
  .appswitch button.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(47,107,255,.35)}
  .appswitch button.active svg{opacity:1}
  .appswitch .pill{margin-left:auto;align-self:center;font-size:11px;color:var(--muted);background:#eef2f9;border:1px solid var(--border);padding:4px 11px;border-radius:20px}

  .body{display:flex;min-height:640px}
  .side{width:226px;background:#fafbfe;border-right:1px solid var(--border);padding:16px 0;display:flex;flex-direction:column}
  .side-header{padding:4px 18px 14px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .side-header .nm{font-weight:800;font-size:15px;letter-spacing:.3px}
  .side-header .nm span{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
  .side-header .tag-app{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:20px}
  .nav-group{font-size:10.5px;color:var(--faint);padding:12px 20px 6px;letter-spacing:1px;text-transform:uppercase}
  .nav-item{margin:3px 12px;padding:10px 13px;cursor:pointer;border-radius:9px;color:#3c4660;display:flex;align-items:center;gap:11px;font-weight:500;transition:.15s;border:1px solid transparent}
  .nav-item svg{width:18px;height:18px;flex:none;opacity:.6}
  .nav-item:hover{background:#eef2f9}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700;border-color:rgba(47,107,255,.25)}
  .app.studio .nav-item.active{border-color:rgba(124,58,237,.25)}
  .side-foot{margin-top:auto;padding:13px 18px;font-size:11px;color:var(--faint);border-top:1px solid var(--border);line-height:1.6}

  .content{flex:1;padding:24px 28px;overflow:auto}
  .content > *{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2{font-size:19px;margin:0 0 4px;font-weight:800;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 20px}

  /* cards / panels */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,40,80,.14)}
  .card .k{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px;font-weight:500}
  .card .k svg{width:15px;height:15px;color:var(--accent);opacity:.8}
  .card .v{font-size:25px;font-weight:800;margin-top:8px;font-family:var(--mono);letter-spacing:.5px}
  .card .v small{font-size:12px;font-weight:500;color:var(--muted);font-family:"Segoe UI",sans-serif}
  .card .spark{position:absolute;right:12px;bottom:10px;opacity:.5}

  .dash{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .panel h3{font-size:14px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px;color:#26324d}
  .panel h3 svg{width:15px;height:15px;color:var(--accent)}

  .legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;justify-content:center}
  .legend .li{display:flex;align-items:center;gap:8px;color:#46526b}
  .legend .li i{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .li b{margin-left:auto;font-family:var(--mono)}
  .donut-wrap{display:flex;align-items:center;gap:18px}
  .donut .dn{font-size:17px;font-weight:800;fill:var(--text);font-family:var(--mono)}
  .donut .dl{font-size:8px;fill:var(--muted)}
  .xv{font-size:7px;fill:var(--text);font-weight:800}
  .xl{font-size:6.5px;fill:var(--muted)}

  .live{display:flex;align-items:center;gap:9px;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  .tlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tlist .tag{font-family:var(--mono);font-size:11.5px;background:#f1f5fb;border:1px solid var(--border);padding:4px 10px;border-radius:8px;color:#41506b}

  .section-h{font-size:14px;font-weight:700;color:#26324d;margin:22px 0 12px;display:flex;align-items:center;gap:9px}
  .section-h::before{content:"";width:4px;height:15px;background:linear-gradient(var(--accent),var(--accent-2));border-radius:2px}
  .section-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.danger{background:var(--danger-soft);color:var(--danger)}
  .badge.off{background:#eef0f3;color:#9499a3}

  .toolbar{display:flex;gap:9px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
  .btn{padding:8px 15px;border:1px solid var(--border);background:#fff;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;color:#33405c;transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .btn svg{width:15px;height:15px}
  .btn:hover{background:#f4f7fc;border-color:var(--accent);color:var(--accent);box-shadow:0 4px 12px rgba(47,107,255,.12)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(47,107,255,.3)}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--danger);border-color:#f3c9c9}
  .btn.danger:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);box-shadow:none}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;border-color:var(--border);color:var(--muted)}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  th,td{border-bottom:1px solid var(--border);padding:10px 12px;text-align:left}
  th{background:#f5f7fb;font-weight:700;color:#56627a;font-size:12px}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover td{background:#f8fbff}
  tbody tr.sel td{background:var(--accent-soft)}
  .chk{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

  .tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:600;background:#eef0f3;color:#535b69}
  .tag.h{background:var(--danger-soft);color:var(--danger)}
  .tag.m{background:var(--warn-soft);color:var(--warn)}
  .tag.l{background:var(--ok-soft);color:var(--ok)}
  .tag.c{background:var(--accent-soft);color:var(--accent)}
  mark{background:#ffd9d9;color:var(--danger);padding:1px 3px;border-radius:3px;font-weight:700}
  .cat-chip{font-size:11.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:#fff;cursor:pointer;color:#56627a;font-weight:500}
  .cat-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  input[type=text],select,input[type=number]{padding:8px 11px;border:1px solid var(--border);border-radius:9px;font-size:12.5px;font-family:inherit;background:#fff;transition:.15s}
  input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  /* toggle */
  .switch{position:relative;display:inline-block;width:42px;height:23px;cursor:pointer;flex:none}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{position:absolute;inset:0;background:#cdd3dc;border-radius:23px;transition:.2s}
  .switch .track::before{content:"";position:absolute;height:17px;width:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch input:checked + .track{background:var(--accent)}
  .switch input:checked + .track::before{transform:translateX(19px)}
  .state-text{font-size:12px;color:var(--muted);font-weight:500}

  /* flow / demo */
  .flow{display:flex;flex-direction:column;align-items:center;gap:0;margin:4px 0 16px}
  .step{background:linear-gradient(180deg,#eef4ff,#e6f0fb);border:1px solid #b9d2f5;color:#1c3d63;border-radius:10px;padding:10px 18px;min-width:300px;text-align:center;font-weight:600}
  .step.danger{background:linear-gradient(180deg,#fdeaea,#fbdcdc);border-color:#f0bcbc;color:var(--danger)}
  .step.ok{background:linear-gradient(180deg,#e7f6ef,#ddf0e4);border-color:#b9e3cd;color:var(--ok)}
  .arrow{color:#9aa6bd;font-size:13px;padding:5px 0;font-weight:800}
  .arrow.b{color:var(--danger)}
  .row2{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .branch{margin-top:12px;background:#fef9ec;border:1px dashed #e6cf94;color:#8a6d1f;border-radius:10px;padding:10px 18px;font-size:12px;text-align:center;max-width:580px}

  .demo-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  textarea{width:100%;height:130px;border:1px solid var(--border);border-radius:10px;padding:11px;font-size:13px;font-family:"Microsoft YaHei",sans-serif;resize:vertical;background:#fff}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .preview{border:1px solid var(--border);border-radius:10px;padding:11px;min-height:64px;background:#f7f9fc;white-space:pre-wrap;line-height:1.7;font-size:13px;font-family:var(--mono);color:#26324d}
  .preview .none{color:var(--muted)}
  .channels{display:flex;gap:9px;margin:10px 0;flex-wrap:wrap}
  .ch{font-size:11.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--border);font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--faint)}
  .ch.on{background:var(--ok-soft);color:var(--ok);border-color:#b9e3cd}

  /* window controls */
  .titlebar .btns span{cursor:pointer;transition:.15s}
  .titlebar .btns span:hover{background:rgba(255,255,255,.45);transform:scale(1.12)}
  /* tray zone (mini-to-tray demo) */
  .trayzone{position:fixed;right:18px;bottom:18px;display:none;align-items:flex-end;gap:12px;z-index:60;animation:fade .2s ease}
  .traytip{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:12px;padding:13px 16px;max-width:248px}
  .traytip .tt{font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
  .traytip .tt .logo{width:24px;height:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:8px;color:#fff}
  .traytip .tt .logo svg{width:14px;height:14px}
  .traytip p{margin:9px 0 13px;font-size:12px;color:var(--muted);line-height:1.65}
  .trayicon{width:48px;height:48px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:15px;display:grid;place-items:center;color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(47,107,255,.4);animation:pulse2 2s infinite}
  .trayicon svg{width:24px;height:24px}
  .trayicon:hover{transform:scale(1.06)}
  @keyframes pulse2{0%,100%{box-shadow:0 8px 24px rgba(47,107,255,.4)}50%{box-shadow:0 8px 36px rgba(47,107,255,.75)}}

  /* floating orb status indicator */
  .orb{position:fixed;right:32px;bottom:32px;width:58px;height:58px;border-radius:50%;z-index:55;cursor:grab;
    background:radial-gradient(circle at 35% 30%,#8fb8ff,#2f6bff);box-shadow:0 6px 22px rgba(47,107,255,.55);
    animation:breathe 2.6s ease-in-out infinite;color:#fff;align-items:center;justify-content:center;display:none}
  .orb.show{display:flex}
  .orb:active{cursor:grabbing}
  .orb svg{width:26px;height:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
  .orb.alert{background:radial-gradient(circle at 35% 30%,#ff9a9a,#ef4444);animation:alertpulse 1s ease-out infinite}
  .orb.offline{background:radial-gradient(circle at 35% 30%,#e9dc97,#b7a23f);animation:none;box-shadow:0 6px 18px rgba(150,140,70,.45)}
  @keyframes breathe{0%,100%{box-shadow:0 6px 22px rgba(47,107,255,.45)}50%{box-shadow:0 6px 34px rgba(47,107,255,.8)}}
  @keyframes alertpulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.75)}70%{box-shadow:0 0 0 26px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  .orb-card{position:fixed;right:32px;bottom:100px;width:212px;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:14px;padding:13px 15px;z-index:56;display:none;animation:fade .18s ease}
  .orb-card.show{display:block}
  .orb-card .ot{font-weight:800;font-size:13px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .orb-card .ot .dot{width:9px;height:9px;border-radius:50%;background:#2f6bff}
  .orb-card .or{display:flex;justify-content:space-between;font-size:12px;color:#46526b;padding:4px 0}
  .orb-card .or b{font-family:var(--mono)}
  .orb-card .hint{margin-top:9px;font-size:11px;color:var(--muted);line-height:1.6}

  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(12,18,34,.42);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
  .dialog{width:420px;max-width:calc(100% - 40px);background:#fff;border-radius:15px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .dialog .dh{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;padding:13px 17px;font-weight:800;display:flex;justify-content:space-between;align-items:center;font-size:14px}
  .dialog .db{padding:17px}
  .dialog .snippet{border:1px solid var(--border);border-radius:10px;padding:11px;background:#f7f9fc;white-space:pre-wrap;line-height:1.8;margin:10px 0;font-size:13px;font-family:var(--mono);color:#26324d}
  .countdown{font-size:11.5px;color:#fff;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:20px;font-family:var(--mono)}
  .modal{width:560px;max-width:calc(100% - 40px);max-height:84vh;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:auto;animation:pop .2s ease}
  .modal .mh{padding:15px 18px;border-bottom:1px solid var(--border);font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .modal .mb{padding:18px}
  .modal .mf{padding:13px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px}
  .modal .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6;background:#f5f7fb;border:1px solid var(--border);border-radius:9px;padding:10px 12px}
  .empty{color:var(--muted);text-align:center;padding:30px;background:#f7f9fc;border:1px dashed var(--border);border-radius:var(--radius)}
  .kv{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef0f3;gap:14px}
  .kv:last-child{border-bottom:none}
  .kv .lbl{color:#3c4660;font-weight:500}
  .kv-right{display:flex;align-items:center;gap:10px}
  .selinfo{font-size:12px;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="titlebar">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
      <span>WordGuard<small id="brandSub">本地违禁词监控</small></span>
    </div>
    <div class="btns"><span onclick="miniToTray()" title="最小化到托盘">–</span><span onclick="toggleMax()" title="最大化/还原">▢</span><span class="close" onclick="closeToTray()" title="关闭（最小化到托盘）">×</span></div>
  </div>

  <div class="appswitch">
    <button data-app="client" class="active" id="swClient">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>监控客户端</button>
    <button data-app="studio" id="swStudio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>词库管理端</button>
    <span class="pill" id="footPill">独立监听程序 · 无服务器</span>
  </div>

  <div class="body">
    <div class="side">
      <div class="side-header">
        <div class="nm" id="sideName">监控客户端<span id="sideSub">后台静默监听</span></div>
        <span class="tag-app" id="sideTag">CLIENT</span>
      </div>
      <div id="nav"></div>
      <div class="side-foot" id="sideFoot">● 无服务器 · 无需联网<br>本地文件分发架构</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- alert dialog -->

/* ---------- matching ---------- */
function enabledWords(){return state.words.filter(w=>w.enabled);}
function findMatches(text){const h=[];for(const w of enabledWords()){if(text.includes(w.text))h.push(w);}return h;}
function highlight(text,hits){
  if(!hits.length) return `<span class="none">（无命中，输入含违禁词时将在此高亮）</span>`;
  let out=esc(text);
  const sorted=[...hits].sort((a,b)=>b.text.length-a.text.length);
  for(const w of sorted){const re=new RegExp(esc(w.text).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');out=out.replace(re,m=>`<mark>${m}</mark>`);}
  return out;
}

/* ---------- charts ---------- */
function svgDonut(segs){
  const total=segs.reduce((a,b)=>a+b.value,0);
  if(!total) return '<div class="empty" style="padding:20px">暂无数据</div>';
  const r=42,C=2*Math.PI*r;let off=0;
  const arcs=segs.map(s=>{const len=total?s.value/total*C:0;const el=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${s.color}" stroke-width="13" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)" stroke-linecap="butt"/>`;off+=len;return el;}).join('');
  return `<svg class="donut" viewBox="0 0 100 100" width="140" height="140">${arcs}<text x="50" y="48" text-anchor="middle" class="dn">${total}</text><text x="50" y="62" text-anchor="middle" class="dl">词</text></svg>`;
}
function svgBars(data){
  const max=Math.max(1,...data.map(d=>d.value));const n=data.length,gap=100/n,bw=gap*0.55;
  const bars=data.map((d,i)=>{const h=Math.max(2,d.value/max*62);const x=i*gap+gap*0.225;const y=82-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="${d.color}"/>`+
    `<text x="${(x+bw/2).toFixed(1)}" y="94" text-anchor="middle" class="xl">${d.label}</text>`+
    (d.value?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" class="xv">${d.value}</text>`:'');}).join('');
  return `<svg viewBox="0 0 100 100" width="100%" height="150" style="overflow:visible">${bars}</svg>`;
}

  const sw=(k,l)=>`<div class="kv"><span class="lbl">${l}</span><div class="kv-right"><span class="state-text">${state.settings[k]?'已开启':'已关闭'}</span><label class="switch"><input type="checkbox" ${state.settings[k]?'checked':''} onchange="state.settings.${k}=this.checked;render()"><span class="track"></span></label></div></div>`;
  return `<h2>设置</h2><div class="sub">告警通道、监控目标、本地词库路径与留存策略</div>
  ${sw('popup','告警 · 弹窗通知')}${sw('sound','告警 · 声音提醒')}${sw('highlight','告警 · 高亮标记（自有界面）')}
  <div class="kv"><span class="lbl">监控目标（进程 EXE，逗号分隔）</span><input type="text" style="width:260px" value="${state.settings.targets.join(',')}" onchange="state.settings.targets=this.value.split(',').map(s=>s.trim()).filter(Boolean);render()"></div>
  <div class="kv"><span class="lbl">本地词库文件路径</span><input type="text" style="width:320px" value="${esc(state.settings.wordlibPath)}" onchange="state.settings.wordlibPath=this.value;render()"></div>
  <div class="kv"><span class="lbl">告警去重窗口（秒）</span><input type="number" style="width:90px" value="${state.settings.dedupe}" onchange="state.settings.dedupe=+this.value;render()"></div>
  <div class="kv"><span class="lbl">日志本地保留（天）</span><input type="number" style="width:90px" value="${state.settings.retention}" onchange="state.settings.retention=+this.value"></div>
  <div class="kv"><span class="lbl">运行环境（.NET Framework 4.8）</span><div class="kv-right"><span class="badge ok">已具备</span><button class="btn" onclick="simulateRuntimeMissing()">模拟缺失</button></div></div>
  <div class="hint">客户端读取本地 wordlib.json（FileSystemWatcher 热重载）；无服务器、无需联网。词库更新由各终端本地文件保证一致。若本机缺运行环境，启动时会弹窗提示并直达官方安装页（点上方「模拟缺失」预览）。</div>`;
};

/* ---------- pages (studio / admin) ---------- */
pages.admin=()=>{
  const total=state.words.length,en=enabledWords().length;
  const cats=[...new Set(state.words.map(w=>w.category))];
  const filtered=state.words.filter(w=>state.catFilter==='全部'||w.category===state.catFilter);
  const rows=filtered.map(w=>`
    <tr class="${state.selected.has(w.id)?'sel':''}">
      <td><input type="checkbox" class="chk" ${state.selected.has(w.id)?'checked':''} onchange="toggleSelect(${w.id},this.checked)"></td>
      <td>${w.id}</td><td><b>${esc(w.text)}</b></td><td><span class="tag c">${esc(w.category)}</span></td>
      <td><span class="tag ${w.severity==='high'?'h':w.severity==='medium'?'m':'l'}">${w.severity==='high'?'高':w.severity==='medium'?'中':'低'}</span></td>
      <td><label class="switch"><input type="checkbox" ${w.enabled?'checked':''} onchange="toggleWord(${w.id},this.checked)"><span class="track"></span></label></td>
      <td><button class="btn danger" onclick="delWord(${w.id})">删除</button></td>
    </tr>`).join('');
  const selN=state.selected.size;
  return `
  <h2>词库管理 · WordGuard Studio</h2><div class="sub">独立桌面程序：批量维护违禁词库，导入导出后分发到各客户端</div>
  <div class="cards">
    <div class="card"><div class="k">${ic.lib}词库总数</div><div class="v">${total}</div></div>
    <div class="card"><div class="k">${ic.run}已启用</div><div class="v">${en}</div></div>
    <div class="card"><div class="k">${ic.warn}已停用</div><div class="v">${total-en}</div></div>
    <div class="card"><div class="k">${ic.target}分类数</div><div class="v">${cats.length}</div></div>
  </div>
  <div class="toolbar">
    <button class="btn primary" onclick="openBulkAdd()">${ic.up}批量添加</button>
    <button class="btn primary" onclick="document.getElementById('fileInput').click()">${ic.down}从 Excel/CSV 导入</button>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.txt" style="display:none" onchange="importFile(this)">
    <button class="btn" onclick="exportLib()">导出 wordlib.json</button>
    <span style="flex:1"></span>
    <span class="selinfo" id="selInfo">${selN?`已选 ${selN} 项`:''}</span>
    <button class="btn" ${selN?'':'disabled'} onclick="batchEnable()">批量启用</button>
    <button class="btn" ${selN?'':'disabled'} onclick="batchDisable()">批量停用</button>
    <button class="btn danger" ${selN?'':'disabled'} onclick="batchDelete()">批量删除</button>
  </div>
  <div class="toolbar">
    <span style="color:var(--muted);font-size:12px">分类筛选：</span>
    <span class="cat-chip ${state.catFilter==='全部'?'on':''}" onclick="state.catFilter='全部';render()">全部</span>
    ${cats.map(c=>`<span class="cat-chip ${state.catFilter===c?'on':''}" onclick="state.catFilter='${esc(c)}';render()">${esc(c)}</span>`).join('')}
  </div>
  <table><tr><th style="width:34px"><input type="checkbox" class="chk" id="selAll" onchange="selectAll(this.checked)"></th><th>ID</th><th>违禁词</th><th>分类</th><th>级别</th><th>状态</th><th>操作</th></tr>${rows||'<tr><td colspan="7" class="empty">该分类下暂无词</td></tr>'}</table>
  <div class="hint">批量添加：支持整段粘贴，每行一个词，可用 <b>词 | 分类 | 级别</b> 格式。导入：支持 .csv / .xlsx（演示环境以 CSV 解析，正式版集成 SheetJS 解析 Excel）。导出后通过共享目录 / U盘 / 邮件 / GPO 下发到各客户端本地路径。</div>`;
};

/* ---------- interactions ---------- */
function render(){$('#content').innerHTML=(pages[state.page]||(()=>''))();if(state.page==='admin'){const sa=$('#selAll');if(sa)sa.checked=state.selected.size>0&&state.selected.size===state.words.length;}if(state.app==='client'){const en=enabledWords().length;const today=state.logs.filter(l=>l.triggered_at.startsWith(now().slice(0,10))).length;const oa=$('#orbAlerts'),ow=$('#orbWords'),ot=$('#orbTargets');if(oa)oa.textContent=today;if(ow)ow.textContent=en;if(ot)ot.textContent=state.settings.targets.length;}}
function closeModal(){$('#modal').style.display='none';$('#modalBox').innerHTML='';}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

window.toggleWord=(id,on)=>{const w=state.words.find(x=>x.id===id);if(w)w.enabled=on;render();};
window.delWord=(id)=>{state.words=state.words.filter(x=>x.id!==id);state.selected.delete(id);render();};
window.clearLogs=()=>{state.logs=[];render();};
window.exportLib=()=>{alert('已导出 wordlib.json（'+enabledWords().length+' 条启用词）\n请通过 共享目录 / U盘 / 邮件 / GPO 分发到各客户端本地路径。');};
window.toggleSelect=(id,on)=>{on?state.selected.add(id):state.selected.delete(id);const si=$('#selInfo');if(si)si.textContent=on||state.selected.size?`已选 ${state.selected.size} 项`:'';const sa=$('#selAll');if(sa)sa.checked=state.selected.size>0&&state.selected.size===state.words.length;const tr=event.target.closest('tr');if(tr)tr.classList.toggle('sel',on);};
window.selectAll=(on)=>{state.words.forEach(w=>on?state.selected.add(w.id):state.selected.delete(w.id));const si=$('#selInfo');if(si)si.textContent=on?`已选 ${state.selected.size} 项`:'';document.querySelectorAll('#content tbody .chk').forEach(c=>{if(c.id!=='selAll'){c.checked=on;c.closest('tr').classList.toggle('sel',on);}});};
window.batchEnable=()=>{state.words.forEach(w=>{if(state.selected.has(w.id))w.enabled=true;});render();};
window.batchDisable=()=>{state.words.forEach(w=>{if(state.selected.has(w.id))w.enabled=false;});render();};
window.batchDelete=()=>{if(!confirm('确认删除选中的 '+state.selected.size+' 个词？'))return;state.words=state.words.filter(w=>!state.selected.has(w.id));state.selected.clear();render();};

/* bulk add modal */
window.openBulkAdd=()=>{
  $('#modalBox').innerHTML=`
    <div class="mh">批量添加违禁词 <span class="x" onclick="closeModal()">×</span></div>
    <div class="mb">
      <p style="margin:0 0 8px;color:var(--muted);font-size:12.5px">每行一个词。支持格式：<b>词</b> 或 <b>词 | 分类 | 级别</b>（级别 high/medium/low，默认 medium）。</p>
      <textarea id="bulkText" style="height:200px;font-family:var(--mono)" placeholder="退货 | 违规承诺 | high&#10;绝对 | 绝对化用语 | medium&#10;最&#10;加微信 | 私下引流 | high"></textarea>
      <div class="hint">将从文本框解析为多条记录，预览无误后一次性加入词库（自动去重）。</div>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmBulkAdd()">解析并添加</button></div>`;
  $('#modal').style.display='flex';
};
window.confirmBulkAdd=()=>{
  const lines=$('#bulkText').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let added=0;
  lines.forEach(l=>{
    const p=l.split(/[|｜\t,]/).map(s=>s.trim());
    const text=p[0];if(!text)return;
    if(state.words.some(w=>w.text===text))return;
    let sev=(p[2]||'medium').toLowerCase();if(!['high','medium','low'].includes(sev))sev='medium';
    state.words.push({id:++state.seq,text,category:p[1]||'未分类',severity:sev,enabled:true});added++;
  });
  closeModal();render();alert(`成功添加 ${added} 条（已跳过重复与空行）。`);
};

/* excel/csv import */
let importRows=[];
window.importFile=input=>{
  const f=input.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{parseImport(e.target.result,f.name);input.value='';};
  reader.readAsText(f,'utf-8');
};
function parseImport(text,name){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length){alert('文件为空或无法解析。');return;}
  let start=0;
  if(/词|word|分类|category|级别|level|severity|违禁/i.test(lines[0]))start=1;
  const rows=lines.slice(start).map(l=>{
    const p=l.split(/[,;\t|｜]/).map(s=>s.trim());
    let text=p[0],cat=p[1]||'未分类',sev=(p[2]||'medium').toLowerCase();
    if(!['high','medium','low'].includes(sev))sev='medium';
    return {text,cat,sev};
  }).filter(r=>r.text);
  if(!rows.length){alert('未解析到有效数据行（演示以 CSV/文本解析；.xlsx 请在正式版用 SheetJS 解析）。');return;}
  const dup=rows.filter(r=>state.words.some(w=>w.text===r.text)).length;
  importRows=rows;
  $('#modalBox').innerHTML=`
    <div class="mh">导入预览 · ${esc(name)} <span class="x" onclick="closeModal()">×</span></div>
    <div class="mb">
      <p style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">共解析 <b style="color:var(--text)">${rows.length}</b> 行，其中 <b style="color:var(--danger)">${dup}</b> 条与现有词库重复（将跳过）。</p>
      <div style="max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:10px">
      <table><tr><th>#</th><th>违禁词</th><th>分类</th><th>级别</th></tr>
      ${rows.slice(0,50).map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.text)}</b></td><td>${esc(r.cat)}</td><td>${r.sev==='high'?'高':r.sev==='medium'?'中':'低'}</td></tr>`).join('')}
      ${rows.length>50?`<tr><td colspan="4" class="empty">…还有 ${rows.length-50} 行</td></tr>`:''}
      </table></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="doImport()">确认导入 ${rows.length-dup} 条</button></div>`;
  $('#modal').style.display='flex';
}
window.doImport=()=>{
  let added=0;
  importRows.forEach(r=>{if(state.words.some(w=>w.text===r.text))return;state.words.push({id:++state.seq,text:r.text,category:r.cat,severity:r.sev,enabled:true});added++;});
  importRows=[];
  closeModal();render();alert(`成功导入 ${added} 条违禁词。`);
};

/* ---------- alert dialog ---------- */
let dlgTimer=null;
function beep(){if(!state.settings.sound)return;try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.type='square';o.frequency.value=880;g.gain.value=.05;o.start();setTimeout(()=>{o.stop();a.close();},180);}catch(e){}}
function showDialog(text,hits){
  const snip=state.settings.highlight?highlight(text,hits):esc(text);
  $('#dlgApp').textContent=state.settings.targets[0]||'csclient.exe';
  $('#dlgSnippet').innerHTML=snip;
  $('#dlgChannels').innerHTML=['弹窗','声音','高亮'].map(c=>{const on=(c==='弹窗'&&state.settings.popup)||(c==='声音'&&state.settings.sound)||(c==='高亮'&&state.settings.highlight);return `<span class="ch ${on?'on':'off'}">${c} ${on?'✓':'✕'}</span>`;}).join('');
  $('#overlay').style.display='flex';clearInterval(dlgTimer);let s=60;$('#dlgCount').textContent=s+'s';
  dlgTimer=setInterval(()=>{$('#dlgCount').textContent=(--s)+'s';if(s<=0)confirmDialog(false);},1000);
  $('#dlgConfirm').onclick=()=>confirmDialog(true);
}
function confirmDialog(ack){
  clearInterval(dlgTimer);$('#overlay').style.display='none';
  const app=state.settings.targets[0]||'csclient.exe';
  const hits=[...state.alerted].map(t=>state.words.find(w=>w.text===t)).filter(Boolean);
  const text=$('#demoInput')?.value||'';
  const chs=[];if(state.settings.popup)chs.push('弹窗');if(state.settings.sound)chs.push('声音');if(state.settings.highlight)chs.push('高亮');
  state.logs.push({triggered_at:now(),process_name:app,window_title:'会话窗口',matched_words:hits,triggered_content:text,alert_channels:chs.length?chs:['(通道全关)'],disposition:ack?'客服已确认':'未确认（超时）'});
  state.alerted.clear();render();
}
function onDemoInput(){
  const text=$('#demoInput').value;const hits=findMatches(text);
  $('#demoPreview').innerHTML=highlight(text,hits);
  const hitSet=new Set(hits.map(h=>h.text));
  for(const h of hits){if(!state.alerted.has(h.text)){state.alerted.add(h.text);if(state.settings.popup)showDialog(text,hits);}}
  for(const t of[...state.alerted]){if(!hitSet.has(t))state.alerted.delete(t);}
  if(hits.length)triggerOrbAlert();
}

/* ---------- runtime-missing prompt ---------- */
window.simulateRuntimeMissing=()=>{
  $('#modalBox').innerHTML=`
    <div class="mh">需要安装运行环境 <span class="x" onclick="closeModal()">×</span></div>
    <div class="mb" style="padding:20px">
      <div style="display:flex;gap:13px;align-items:flex-start">
        <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;display:grid;place-items:center;flex:none">${ic.warn}</div>
        <div>
          <p style="margin:0 0 12px;font-size:13px;line-height:1.75;color:#33405c">本机未检测到所需的 <b>.NET Framework 4.8</b> 运行环境，客户端无法启动。<br>请点击下方按钮前往官方下载并安装，完成后重新打开本程序即可。</p>
          <div style="display:flex;gap:9px">
            <button class="btn primary" onclick="window.open('https://dotnet.microsoft.com/download/dotnet-framework/net48','_blank');closeModal();">前往安装</button>
            <button class="btn" onclick="closeModal();alert('真实程序中：此按钮将退出客户端。');">退出</button>
          </div>
        </div>
      </div>
    </div>`;
  $('#modal').style.display='flex';
};

/* ---------- mini to tray ---------- */
window.miniToTray=()=>{$('#app').style.display='none';$('#trayZone').style.display='flex';};
window.restoreWin=()=>{$('#trayZone').style.display='none';$('#app').style.display='';};
window.closeToTray=()=>{miniToTray();alert('已最小化到系统托盘，后台继续监控。\n（真实程序中：关闭按钮默认即最小化到托盘，不退出；需右键托盘图标选「退出」才真正关闭。）');};
window.toggleMax=()=>{const a=$('#app');const full=a.style.maxWidth==='none';a.style.maxWidth=full?'':'none';a.style.margin=full?'24px auto':'0 auto';a.style.borderRadius=full?'18px':'0';
  document.querySelector('.app').scrollIntoView({block:'start'});};

/* ---------- floating orb ---------- */
function initOrb(){
  const orb=$('#orb');let sx,sy,ox,oy,moved=false;
  orb.addEventListener('mousedown',e=>{moved=false;sx=e.clientX;sy=e.clientY;const r=orb.getBoundingClientRect();ox=r.left;oy=r.top;orb.style.right='auto';orb.style.bottom='auto';orb.style.left=ox+'px';orb.style.top=oy+'px';});
  window.addEventListener('mousemove',e=>{if(e.buttons!==1)return;orb.style.left=(ox+(e.clientX-sx))+'px';orb.style.top=(oy+(e.clientY-sy))+'px';if(Math.abs(e.clientX-sx)>3||Math.abs(e.clientY-sy)>3)moved=true;});
  orb.addEventListener('click',()=>{if(!moved)toggleOrbCard();});
}
window.triggerOrbAlert=()=>{const orb=$('#orb');if(!orb.classList.contains('show'))return;orb.classList.remove('offline');orb.classList.add('alert');clearTimeout(orb._t);orb._t=setTimeout(()=>orb.classList.remove('alert'),3000);};
window.toggleOrbOffline=()=>{const orb=$('#orb');const off=orb.classList.toggle('offline');orb.classList.remove('alert');$('#orbCard .ot').innerHTML=off?'<span class="dot" style="background:#b7a23f"></span>词库离线':'<span class="dot"></span>实时监控中';};
window.toggleOrbCard=()=>{$('#orbCard').classList.toggle('show');};
document.addEventListener('click',e=>{if(!e.target.closest('#orb')&&!e.target.closest('#orbCard'))$('#orbCard').classList.remove('show');});

/* ---------- init ---------- */
renderNav();render();initOrb();
</script>
</body>
</html>
